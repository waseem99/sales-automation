services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TALENTTRACK_POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: ${TALENTTRACK_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TALENTTRACK_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TALENTTRACK_POSTGRES_DB}
    volumes:
      - talenttrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  talenttrack-postgres-data:
    name: codistan-talenttrack-postgres-data

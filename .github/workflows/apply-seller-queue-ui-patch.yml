name: Apply Seller Queue UI Patch

on:
  push:
    branches:
      - agent/persistent-seller-queues-272
    paths:
      - '.github/workflows/apply-seller-queue-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/persistent-seller-queues-272
          fetch-depth: 0
      - run: node scripts/apply-seller-queue-ui-patch.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/prospects-page.ts apps/web/src/prospect-handler.ts scripts/apply-seller-queue-ui-patch.mjs .github/workflows/apply-seller-queue-ui-patch.yml
          git commit -m "Integrate persistent seller queues into Prospect Desk"
          git push origin HEAD:agent/persistent-seller-queues-272

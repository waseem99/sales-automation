name: TalentTrack Pilot Release Baseline CI

on:
  pull_request:
    branches:
      - agent/commercial-analytics-foundation-243
    paths:
      - '.github/workflows/talenttrack-release-baseline-ci.yml'
      - 'docs/TALENTTRACK_RELEASE_BASELINE.md'
      - 'workers/acquisition/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/**'
      - 'api/**'
      - 'vercel/**'
      - 'scripts/**'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talenttrack-release-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate canonical installer, compatibility and production build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install standalone pnpm
        run: npm install --global --force @pnpm/exe@9.15.9

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate TalentTrack release contract
        working-directory: workers/acquisition
        run: node tests/talenttrack_release_baseline_contract.mjs

      - name: Validate Windows bundle behavior
        working-directory: workers/acquisition
        run: python -m unittest tests.test_windows_bundle -v

      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem workers/acquisition/scripts/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $errors += $parseErrors | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($errors.Count -gt 0) { throw ($errors -join "`n") }

      - name: Run acquisition runtime tests
        working-directory: workers/acquisition
        run: python -m unittest discover -s tests -v

      - name: Preserve source and Prospect Desk contracts
        working-directory: workers/acquisition
        run: |
          node tests/upwork_extension_contract.mjs
          node tests/linkedin_extension_contract.mjs
          node tests/sales_navigator_extension_contract.mjs
          node tests/prospect_desk_bridge_contract.mjs
          node tests/sales_navigator_bridge_contract.mjs
          node tests/commercial_analytics_bridge_contract.mjs

      - name: Build workspace packages
        run: pnpm build

      - name: Build complete production workspace
        run: pnpm build:vercel

name: Outreach Workbench CI

on:
  pull_request:
    branches:
      - agent/bd-workspace-foundation-232
    paths:
      - '.github/workflows/outreach-workbench-ci.yml'
      - 'packages/outreach-workbench/**'
      - 'api/outreach-workbench.ts'
      - 'vercel/outreach-workbench-ui.ts'
      - 'vercel/workspace-dashboard-runtime.js'
      - 'vercel.json'
      - 'workers/acquisition/tests/outreach_workbench_contract.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/**'
      - 'vercel/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outreach-workbench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate outreach lifecycle, safety and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global --force @pnpm/exe@9.15.9
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build workspace packages
        id: workspace_build
        continue-on-error: true
        run: pnpm build > outreach-workbench-build.log 2>&1
      - name: Test outreach workbench behavior
        id: behavior
        if: steps.workspace_build.outcome == 'success'
        continue-on-error: true
        run: pnpm --filter @sales-automation/outreach-workbench test > outreach-workbench-test.log 2>&1
      - name: Validate outreach safety bridge
        id: contract
        if: steps.behavior.outcome == 'success'
        continue-on-error: true
        working-directory: workers/acquisition
        run: node tests/outreach_workbench_contract.mjs > ../../outreach-workbench-contract.log 2>&1
      - name: Type-check Vercel integration
        id: vercel_typecheck
        if: steps.contract.outcome == 'success'
        continue-on-error: true
        run: pnpm typecheck:vercel > outreach-workbench-vercel-typecheck.log 2>&1
      - name: Build production workspace
        id: production_build
        if: steps.vercel_typecheck.outcome == 'success'
        continue-on-error: true
        run: pnpm build:vercel > outreach-workbench-production-build.log 2>&1
      - name: Prepare diagnostics
        if: always()
        run: |
          for file in outreach-workbench-build.log outreach-workbench-test.log outreach-workbench-contract.log outreach-workbench-vercel-typecheck.log outreach-workbench-production-build.log; do
            test -f "$file" || touch "$file"
          done
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outreach-workbench-diagnostics
          path: |
            outreach-workbench-build.log
            outreach-workbench-test.log
            outreach-workbench-contract.log
            outreach-workbench-vercel-typecheck.log
            outreach-workbench-production-build.log
          retention-days: 3
      - name: Enforce workspace build
        if: steps.workspace_build.outcome != 'success'
        run: cat outreach-workbench-build.log && exit 1
      - name: Enforce behavior
        if: steps.workspace_build.outcome == 'success' && steps.behavior.outcome != 'success'
        run: cat outreach-workbench-test.log && exit 1
      - name: Enforce safety contract
        if: steps.behavior.outcome == 'success' && steps.contract.outcome != 'success'
        run: cat outreach-workbench-contract.log && exit 1
      - name: Enforce Vercel type-check
        if: steps.contract.outcome == 'success' && steps.vercel_typecheck.outcome != 'success'
        run: cat outreach-workbench-vercel-typecheck.log && exit 1
      - name: Enforce production build
        if: steps.vercel_typecheck.outcome == 'success' && steps.production_build.outcome != 'success'
        run: tail -n 400 outreach-workbench-production-build.log && exit 1

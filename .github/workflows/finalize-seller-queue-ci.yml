name: Finalize Seller Queue CI

on:
  pull_request:
    branches:
      - agent/component-scoring-271
    paths:
      - '.github/workflows/finalize-seller-queue-ci.yml'
      - 'scripts/finalize-seller-queue-ci.mjs'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/persistent-seller-queues-272
          fetch-depth: 0
      - run: node scripts/finalize-seller-queue-ci.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize persistent seller queue validation"
          git push origin HEAD:agent/persistent-seller-queues-272

name: Offer Readiness Enforcement CI

on:
  pull_request:
    branches:
      - agent/prospecting-os-release-candidate-226
    paths:
      - '.github/workflows/offer-readiness-ci.yml'
      - 'packages/commercial-readiness/**'
      - 'packages/outreach-workbench/**'
      - 'api/outreach-workbench.ts'
      - 'vercel/acquisition-campaign-runtime.ts'
      - 'vercel/outreach-workbench-ui.ts'
      - 'workers/acquisition/tests/offer_readiness_api_contract.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offer-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Enforce qualification, draft and approval readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install standalone pnpm
        run: npm install --global --force @pnpm/exe@9.15.9

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test commercial readiness policy
        run: pnpm --filter @sales-automation/commercial-readiness test

      - name: Build shared workspace types
        run: pnpm --filter @sales-automation/shared build

      - name: Type-check commercial readiness policy
        run: pnpm --filter @sales-automation/commercial-readiness typecheck

      - name: Validate API and qualification integration
        working-directory: workers/acquisition
        run: node tests/offer_readiness_api_contract.mjs

      - name: Type-check outreach integration
        run: pnpm exec tsc -p tsconfig.outreach-workbench.json --noEmit

name: Commercial Analytics and Calibration CI

on:
  pull_request:
    branches:
      - agent/outreach-workbench-foundation-233
    paths:
      - '.github/workflows/commercial-analytics-ci.yml'
      - 'packages/commercial-analytics/**'
      - 'packages/neon-state/src/commercial-calibration.ts'
      - 'packages/neon-state/package.json'
      - 'api/commercial-analytics.ts'
      - 'vercel.json'
      - 'workers/acquisition/tests/commercial_analytics_bridge_contract.mjs'
      - 'workers/acquisition/tests/*extension_contract.mjs'
      - 'tsconfig.commercial-analytics.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/**'
      - 'vercel/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commercial-analytics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate analytics, calibration and production integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install standalone pnpm
        run: npm install --global --force @pnpm/exe@9.15.9

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Test commercial analytics behavior
        run: pnpm --filter @sales-automation/commercial-analytics test

      - name: Validate analytics safety and integration bridge
        working-directory: workers/acquisition
        run: node tests/commercial_analytics_bridge_contract.mjs

      - name: Preserve acquisition source regressions
        working-directory: workers/acquisition
        run: |
          node tests/upwork_extension_contract.mjs
          node tests/linkedin_extension_contract.mjs
          node tests/sales_navigator_extension_contract.mjs

      - name: Type-check focused integration
        run: pnpm exec tsc -p tsconfig.commercial-analytics.json --noEmit

      - name: Build full production workspace
        run: pnpm build:vercel

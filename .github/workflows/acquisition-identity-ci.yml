name: Acquisition Identity Graph CI

on:
  pull_request:
    branches:
      - agent/unified-prospecting-os-235
    paths:
      - '.github/workflows/acquisition-identity-ci.yml'
      - 'packages/identity-graph/**'
      - 'api/acquisition-ingest.ts'
      - 'vercel/acquisition-identity-runtime.ts'
      - 'workers/acquisition/tests/identity_graph_bridge_contract.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/**'
      - 'apps/web/**'
      - 'vercel/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acquisition-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    name: Test deterministic identity and production integration
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install standalone pnpm
        run: npm install --global --force @pnpm/exe@9.15.9

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test identity graph behavior
        run: pnpm --filter @sales-automation/identity-graph test

      - name: Validate non-destructive ingestion bridge
        working-directory: workers/acquisition
        run: node tests/identity_graph_bridge_contract.mjs

      - name: Build full production workspace
        shell: bash
        run: |
          set +e
          pnpm build:vercel > acquisition-identity-production-build.log 2>&1
          status=$?
          tail -n 300 acquisition-identity-production-build.log
          exit $status

      - name: Type-check Vercel runtime
        run: pnpm typecheck:vercel

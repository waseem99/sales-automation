name: Fix Seller Queue Contract Scope

on:
  pull_request:
    branches:
      - agent/component-scoring-271
    paths:
      - '.github/workflows/fix-seller-queue-contract-scope.yml'
      - 'scripts/fix-seller-queue-contract-scope.mjs'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/persistent-seller-queues-272
          fetch-depth: 0
      - run: node scripts/fix-seller-queue-contract-scope.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/acquisition/tests/seller_queue_integration_contract.ts workers/acquisition/tests/.seller-queue-contract-diagnostic.txt scripts/fix-seller-queue-contract-scope.mjs .github/workflows/fix-seller-queue-contract-scope.yml
          git commit -m "Fix seller queue integration boundary scope"
          git push origin HEAD:agent/persistent-seller-queues-272

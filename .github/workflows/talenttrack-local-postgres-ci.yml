name: TalentTrack Local PostgreSQL CI

on:
  pull_request:
    branches:
      - agent/talenttrack-pilot-baseline-226
    paths:
      - '.github/workflows/talenttrack-local-postgres-ci.yml'
      - 'docs/TALENTTRACK_LOCAL_POSTGRES.md'
      - 'docs/TALENTTRACK_RELEASE_BASELINE.md'
      - 'workers/acquisition/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/**'
      - 'api/**'
      - 'vercel/**'
      - 'scripts/**'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: talenttrack-local-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PostgreSQL migration, shadow, Windows controls and production build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: talenttrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d talenttrack_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/talenttrack_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install standalone pnpm
        run: npm install --global --force @pnpm/exe@9.15.9

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install pinned TalentTrack Python dependencies
        working-directory: workers/acquisition
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Validate local PostgreSQL safety contract
        working-directory: workers/acquisition
        run: node tests/local_postgres_contract.mjs

      - name: Validate release baseline contract
        working-directory: workers/acquisition
        run: node tests/talenttrack_release_baseline_contract.mjs

      - name: Exercise real PostgreSQL import and rollback shadow
        working-directory: workers/acquisition
        run: python -m unittest tests.test_postgres_storage -v

      - name: Run complete acquisition runtime suite against PostgreSQL service
        working-directory: workers/acquisition
        run: python -m unittest discover -s tests -v

      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem workers/acquisition/scripts/windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $errors += $parseErrors | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($errors.Count -gt 0) { throw ($errors -join "`n") }

      - name: Preserve acquisition and Prospect Desk contracts
        working-directory: workers/acquisition
        run: |
          node tests/upwork_extension_contract.mjs
          node tests/linkedin_extension_contract.mjs
          node tests/sales_navigator_extension_contract.mjs
          node tests/prospect_desk_bridge_contract.mjs
          node tests/sales_navigator_bridge_contract.mjs
          node tests/commercial_analytics_bridge_contract.mjs

      - name: Build workspace packages
        run: pnpm build

      - name: Build complete production workspace
        run: pnpm build:vercel

name: Fix Decision Score Literal

on:
  push:
    branches:
      - agent/component-scoring-271
    paths:
      - '.github/workflows/fix-decision-score-literal.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/component-scoring-271
          fetch-depth: 0
      - run: node scripts/fix-decision-score-literal.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/decision-scoring/src/index.ts scripts/fix-decision-score-literal.mjs .github/workflows/fix-decision-score-literal.yml
          git commit -m "Fix decision score version literal typing"
          git push origin HEAD:agent/component-scoring-271

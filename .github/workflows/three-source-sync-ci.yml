name: Three-Source Sync Idempotency CI

on:
  pull_request:
    branches:
      - agent/prospecting-os-release-candidate-226
    paths:
      - '.github/workflows/three-source-sync-ci.yml'
      - 'api/acquisition-ingest.ts'
      - 'vercel/acquisition-sync-reconciliation.ts'
      - 'workers/acquisition/acquisition_v4/sync.py'
      - 'workers/acquisition/tests/test_sync.py'
      - 'workers/acquisition/tests/sync_reconciliation_contract.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-source-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Prove durable replay and seller-field preservation
    runs-on: ubuntu-latest
    timeout-minutes: 26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile sync runtime
        working-directory: workers/acquisition
        run: python -m compileall -q acquisition_v4/sync.py tests/test_sync.py

      - name: Test durable three-source outbox and replay
        working-directory: workers/acquisition
        env:
          PYTHONPATH: .
        run: python -m unittest tests.test_sync -v

      - name: Install standalone pnpm
        run: npm install --global --force @pnpm/exe@9.15.9

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build production workspace
        run: pnpm build

      - name: Test server reconciliation and conflict behavior
        run: pnpm exec tsx workers/acquisition/tests/sync_reconciliation_contract.ts

      - name: Type-check Vercel ingestion integration
        run: pnpm typecheck:vercel

      - name: Enforce human-action boundary
        shell: bash
        run: |
          ! grep -R "externalActionAutomated: true\|external_action_automated.*True" \
            api/acquisition-ingest.ts \
            vercel/acquisition-sync-reconciliation.ts \
            workers/acquisition/acquisition_v4/sync.py
